<section class="globe-shell" [class.is-dragging]="dragging">
  <div class="globe-heading">
    <div>
      <span>INTERACTIVE WORLD ATLAS</span>
      <h2>Your journeys around the world</h2>
    </div>
    <div class="globe-actions">
      <button type="button" (click)="toggleRotation()" [attr.aria-label]="rotating() ? 'Pause globe rotation' : 'Play globe rotation'">
        {{ rotating() ? 'Ⅱ' : '▶' }} <span>{{ rotating() ? 'Pause' : 'Rotate' }}</span>
      </button>
      <button type="button" (click)="resetView()" aria-label="Reset globe view">↺ <span>Reset</span></button>
    </div>
  </div>

  <div class="globe-stage">
    <canvas
      #canvas
      tabindex="0"
      aria-label="Interactive world globe. Drag to rotate and use the mouse wheel to zoom. Visited countries display their national flags."
      (pointerdown)="pointerDown($event)"
      (pointermove)="pointerMove($event)"
      (pointerup)="pointerUp($event)"
      (pointercancel)="pointerUp($event)"
      (wheel)="wheel($event)"
    ></canvas>
    @if (loading()) { <div class="globe-message"><i></i><span>Building your world…</span></div> }
    @if (error()) { <div class="globe-message error"><span>World map could not be loaded.</span></div> }
    <div class="globe-legend">
      <span><i class="visited"></i> Visited · national flag</span>
      <span><i></i> Not visited</span>
    </div>
    <p class="globe-hint">Drag to rotate · Scroll to zoom</p>
  </div>
</section>
